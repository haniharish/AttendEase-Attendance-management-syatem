# ==============================================================================
# AttendEase Nagios Service Definitions
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Frontend Services
# ------------------------------------------------------------------------------
define service {
    use                     generic-service
    host_name               attendease-frontend
    service_description     Frontend Web UI Accessibility
    check_command           check_attendease_http!80!/!2!5
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_interval   60
}

define service {
    use                     generic-service
    host_name               attendease-frontend
    service_description     Nginx Web Server TCP
    check_command           check_attendease_tcp!80!2!5
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_interval   60
}

