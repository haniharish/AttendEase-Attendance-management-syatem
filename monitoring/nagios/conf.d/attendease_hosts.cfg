# ==============================================================================
# AttendEase Nagios Host Definitions
# ==============================================================================

# Frontend Container Host (React + Nginx on internal docker network)
define host {
    use                     linux-server
    host_name               attendease-frontend
    alias                   AttendEase Frontend (React + Nginx)
    address                 frontend
    check_command           check_tcp!80!2!5
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    notification_interval   60
    notifications_enabled   1
}

# Backend Container Host (Express Node.js on internal docker network)
define host {
    use                     linux-server
    host_name               attendease-backend
    alias                   AttendEase Backend (Node.js + Express)
    address                 backend
    check_command           check_tcp!6000!2!5
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    notification_interval   60
    notifications_enabled   1
}

# MongoDB Container Host (MongoDB Database on internal docker network)
define host {
    use                     linux-server
    host_name               attendease-mongodb
    alias                   AttendEase Database (MongoDB 7.0)
    address                 mongodb
    check_command           check_tcp!27017!2!5
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    notification_interval   60
    notifications_enabled   1
}
