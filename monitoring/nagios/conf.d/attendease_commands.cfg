# ==============================================================================
# AttendEase Custom Nagios Command Definitions
# ==============================================================================

# HTTP check for Frontend and API
define command {
    command_name    check_attendease_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -w $ARG3$ -c $ARG4$
}

# HTTP check with content verification for Backend Health API
define command {
    command_name    check_attendease_api
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -w $ARG3$ -c $ARG4$ -s "$ARG5$"
}

# TCP port connection check (MongoDB, Nginx, Express)
define command {
    command_name    check_attendease_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

# Docker Container State & Health Check
define command {
    command_name    check_docker_container
    command_line    /bin/bash $USER1$/check_docker.sh $ARG1$
}

# Host System Resource Checks
define command {
    command_name    check_host_cpu
    command_line    $USER1$/check_load -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_host_memory
    command_line    $USER1$/check_mem.pl -C -u -w 80 -c 90
}

define command {
    command_name    check_host_disk
    command_line    $USER1$/check_disk -w 20% -c 10% -p /
}

define command {
    command_name    check_host_uptime
    command_line    $USER1$/check_uptime
}
